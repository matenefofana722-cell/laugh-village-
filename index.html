<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial}
body{background:#000;color:#fff;overflow:hidden}
.wrap{width:100%;max-width:430px;height:100dvh;margin:0 auto;background:#000;position:relative;display:flex;flex-direction:column}
/* top */
.top{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #111}
.top b{font-size:18px;font-weight:700}
.top .mid{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:24px}
.top .mid b{opacity:.5} .top .mid b.active{opacity:1}
.icon{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.6}
/* caption top */
.captionTop{height:34vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 20px;background:#000}
.captionTop h1{font-size:29px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
/* video area */
.video{height:36vh;background:#0f0f0f;position:relative;overflow:hidden}
.video img{width:100%;height:100%;object-fit:cover;opacity:.95}
.mute{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:62px;height:62px;background:rgba(0,0,0,.6);border-radius:50%;display:grid;place-items:center;font-size:22px;backdrop-filter:blur(2px)}
/* right actions */
.actions{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;align-items:center;z-index:2}
.act{text-align:center;font-size:12px;font-weight:600;color:#fff}
.act svg{width:28px;height:28px;display:block;margin:0 auto 4px;stroke:#fff;fill:none;stroke-width:1.5}
.act span{font-size:13px}
.act.liked svg{fill:#ff3040;stroke:#ff3040}
/* bottom info */
.bottom{margin-top:auto;padding:12px 14px 16px;background:linear-gradient(0deg,#000 70%,transparent)}
.row{display:flex;align-items:center;gap:8px}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover}
.username{font-weight:700;font-size:14px}
.follow{margin-left:10px;border:1px solid #fff;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;background:transparent;color:#fff}
.music{font-size:12.5px;margin-top:8px;opacity:.9;display:flex;align-items:center;gap:6px}
.desc{font-size:13px;margin-top:6px;opacity:.85;line-height:1.3}
.bottomRight{position:absolute;right:12px;bottom:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.small-icon{width:26px;height:26px;opacity:.95}
.sticker{width:32px;height:32px;border-radius:6px;background:#ffcc00;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    <div class="mid"><b class="active">Reels</b><b style="display:flex;align-items:center;gap:6px">Friends <span style="display:flex"> <img style="width:22px;height:22px;border-radius:50%;border:1px solid #000;margin-left:-4px" src="https://i.pravatar.cc/100?img=1"> <img style="width:22px;height:22px;border-radius:50%;border:1px solid #000;margin-left:-4px" src="https://i.pravatar.cc/100?img=2"> </span></b></div>
    <svg class="icon" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/></svg>
  </div>

  <div class="captionTop"><h1>How was the goat?</h1></div>

  <div class="video">
    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=700&q=80">
    <div class="mute">🔈</div>
    <div class="play">▶</div>

    <div class="actions">
      <div class="act" id="likeBtn" onclick="this.classList.toggle('liked')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-4.3-9-8.5A5 5 0 0 1 12 7a5 5 0 0 1 9 5.5c-2.5 4.2-9 8.5-9 8.5z"/></svg><span>Likes</span></div>
      <div class="act"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l2.1-5.3A8.5 8.5 0 0 1 21 11.5z"/></svg><span>102</span></div>
      <div class="act"><svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg><span>252</span></div>
      <div class="act"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
      <div class="act"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span>13.7K</span></div>
    </div>
  </div>

  <div class="bottom">
    <div class="row">
      <img class="avatar" src="https://i.pravatar.cc/150?img=33">
      <div class="username">pintu.encounters</div>
      <button class="follow">Follow</button>
    </div>
    <div class="music">♫ iix) Ozuna, Omah Lay · Soso (Remix)</div>
    <div class="desc">For extended content, go to my profile ...</div>
    
    <div class="bottomRight">
      <svg class="small-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
      <div class="sticker"><img style="width:100%;height:100%;object-fit:cover" src="https://i.pravatar.cc/100?img=12"></div>
    </div>
  </div>
</div>
</body>
</html>
