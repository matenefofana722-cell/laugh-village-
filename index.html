<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#000;color:#fff;max-width:470px;margin:0 auto}
.top{position:sticky;top:0;background:#000;border-bottom:1px solid #222;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-size:22px;font-weight:800}
.live{border:1px solid #00ff00;color:#00ff00;padding:2px 10px;border-radius:20px;font-size:12px}
.stories{display:flex;gap:14px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid #222}
.story{text-align:center;min-width:60px}
.ring{width:60px;height:60px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring-inner{background:#000;width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.story p{font-size:11px;margin-top:5px}
.post{border-bottom:1px solid #222;padding-bottom:10px}
.post-head{display:flex;align-items:center;gap:10px;padding:12px 16px}
.avatar{width:32px;height:32px;background:#333;border-radius:50%;display:flex;align-items:center;justify-content:center}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#111}
.actions{display:flex;gap:16px;padding:10px 16px;font-size:22px}
.caption{padding:0 16px 10px;font-size:14px;line-height:1.4}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0}
.bottom div{font-size:22px;text-align:center}
.active{color:#fff}
.hint{color:#888;font-size:12px}
</style>
</head>
<body>

<div class="top">
<div class="logo">😂 Laugh Village</div>
<div class="live">• LIVE</div>
</div>

<div class="stories">
<div class="story"><div class="ring"><div class="ring-inner">👤</div></div><p>matene</p></div>
<div class="story"><div class="ring"><div class="ring-inner">🌍</div></div><p>village</p></div>
<div class="story"><div class="ring"><div class="ring-inner">🔥</div></div><p>trending</p></div>
<div class="story"><div class="ring"><div class="ring-inner">😂</div></div><p>laughs</p></div>
<div class="story"><div class="ring"><div class="ring-inner">✏️</div></div><p>new</p></div>
</div>

<div class="post">
<div class="post-head">
<div class="avatar">M</div>
<div><b>@matene</b> <span class="hint">• now • NW10</span><br><span class="hint">Village tools</span></div>
<div style="margin-left:auto">⋯</div>
</div>
<img class="post-img" src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=800">
<div class="actions">
<div>❤️</div>
<div>💬</div>
<div>↗️</div>
<div style="margin-left:auto">🔖</div>
</div>
<div class="caption">
<b>@matene</b> Village tools — we build with what we have 🔥 Discreet build V2 IG Style<br>
<span class="hint">12 likes • 3 comments</span>
</div>
</div>

<div style="height:60px"></div>
<div class="bottom">
<div>❤️<br><span class="hint">Like</span></div>
<div>🔍<br><span class="hint">Search</span></div>
<div>✏️<br><span class="hint">Post</span></div>
<div>🌍<br><span class="hint">Village</span></div>
<div>👤<br><span class="hint">Profile</span></div>
</div>

</body>
</html>
